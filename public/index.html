<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポケットファミリー">
<title>AIポケットファミリー</title>
<style>
  :root {
    --bg: #fff7ec;
    --ink: #3a2e24;
    --sub: #6f5f51;
    --me: #ffd9a8;
    --her: #ffffff;
    --line: #ecdcc6;
    --accent: #e8743b;
    --accent-ink: #ffffff;
    --mic: #2f7d6d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    font-size: 22px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 0px) 14px 0;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .avatar { width: 84px; height: 84px; flex: none; }
  .avatar img { width: 100%; height: 100%; object-fit: contain; display: block; transform-origin: 50% 90%; animation: bob 3.2s ease-in-out infinite; }
  .avatar.talking img { animation: chatter .5s ease-in-out infinite; }
  .avatar.listening-face img { animation: lean 1.6s ease-in-out infinite; }
  .avatar.happy img { animation: hop .6s ease-in-out 4; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-14px) scale(1.05, .95); } 70% { transform: translateY(0) scale(1.06, .94); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.01, .99); } }
  @keyframes chatter { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(1.03, .97); } }
  @keyframes lean { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* 家族えらび */
  .setup { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .setup-in { max-width: 560px; margin: 0 auto; text-align: center; }
  .setup h1 { font-size: 26px; line-height: 1.45; margin: 8px 0 16px; }
  .setup p { margin: 0 0 16px; color: var(--sub); font-size: 18px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px 14px; background: #fff; border: 3px solid var(--line); border-radius: 20px; color: var(--ink); font-size: 16px; line-height: 1.45; }
  .card img { width: 100%; max-width: 180px; aspect-ratio: 1; object-fit: contain; }
  .card b { font-size: 24px; }
  .card:active { border-color: var(--accent); }
  .pick-img { width: 200px; max-width: 70%; aspect-ratio: 1; object-fit: contain; animation: bob 3.2s ease-in-out infinite; }
  .name-input { width: 100%; font: inherit; font-size: 26px; text-align: center; padding: 12px; border: 3px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); margin-bottom: 14px; }
  .name-input:focus { outline: none; border-color: var(--accent); }
  .big-btn { width: 100%; font-size: 22px; font-weight: 700; min-height: 60px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; margin-bottom: 10px; }
  .sub-btn { font-size: 17px; min-height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--sub); }
  .skip { display: block; margin: 0 0 8px auto; font-size: 16px; color: var(--sub); background: #fff; border: 1px solid var(--line); border-radius: 999px; min-height: 44px; padding: 0 16px; }
  .who { flex: 1; min-width: 0; }
  .who .name { font-size: 26px; font-weight: 700; line-height: 1.3; }
  .who .status { font-size: 17px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reset {
    flex: none;
    font-size: 14px;
    color: var(--sub);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 10px;
    min-height: 44px;
  }
  .reset.armed { color: #b3261e; border-color: #e7a19b; }
  .who .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 360px) {
    .avatar { width: 64px; height: 64px; }
    .who .name { font-size: 22px; }
    .head-btns .memo-btn { min-width: 48px; padding: 4px; font-size: 12px; }
    .who .name .hearts { display: block; margin-left: 0; font-size: 14px; }
  }
  .who .name .hearts { font-size: 16px; color: #e0607e; letter-spacing: 1px; margin-left: 6px; font-weight: 400; vertical-align: 2px; }
  .memo-btn { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; line-height: 1.2; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 14px; min-width: 60px; min-height: 56px; padding: 4px 6px; }
  .memo-btn .ico { font-size: 22px; line-height: 1; }
  .memo-btn.new { border-color: #e0607e; }

  .head-btns { flex: none; display: flex; gap: 6px; }
  .head-btns .memo-btn { min-width: 54px; }
  .song-btn { display: block; margin-top: 8px; font-size: 19px; font-weight: 700; color: #fff; background: #8a5cc2; border: 0; border-radius: 999px; min-height: 48px; padding: 0 18px; }

  /* 歌 */
  .song-list li { padding: 0; }
  .song-list button { width: 100%; text-align: left; font-size: 20px; background: transparent; border: 0; padding: 12px 14px; color: var(--ink); min-height: 56px; }
  .song-list .tag { display: inline-block; font-size: 14px; color: #fff; background: #8a5cc2; border-radius: 999px; padding: 0 10px; margin-left: 8px; vertical-align: 2px; }
  .player-char { display: block; width: 150px; height: 150px; object-fit: contain; margin: 4px auto 0; transform-origin: 50% 90%; }
  .player-char.dance { animation: dance .9s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .player-char { animation: none !important; } }
  @keyframes dance { 0%, 100% { transform: rotate(-6deg) translateY(0); } 25% { transform: rotate(0) translateY(-10px); } 50% { transform: rotate(6deg) translateY(0); } 75% { transform: rotate(0) translateY(-10px); } }
  .player-char.cheer { animation: hop .6s ease-in-out 4; }
  .player-title { text-align: center; font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
  .player-note { text-align: center; color: var(--sub); font-size: 15px; margin: 0 0 8px; }
  .lyrics { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; font-size: 26px; line-height: 1.8; white-space: pre-wrap; text-align: center; max-height: 42vh; overflow-y: auto; }
  .player-ctrl { display: flex; gap: 8px; margin: 12px 0 8px; }
  .player-ctrl button { flex: 1; font-size: 20px; font-weight: 700; min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); }
  .player-ctrl .play { background: #8a5cc2; border-color: #8a5cc2; color: #fff; flex: 1.4; }
  .sang { width: 100%; font-size: 24px; font-weight: 700; min-height: 64px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; }

  /* 思い出ノート */
  .sheet { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .sheet-in { max-width: 560px; margin: 0 auto; }
  .sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .sheet-head img { width: 88px; height: 88px; object-fit: contain; }
  .sheet-head h2 { flex: 1; font-size: 24px; margin: 0; line-height: 1.35; }
  .sheet .close-btn { flex: none; font-size: 17px; min-height: 48px; padding: 0 16px; border: 2px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
  .stat .big { font-size: 24px; font-weight: 700; }
  .stat .hearts { color: #e0607e; font-size: 24px; letter-spacing: 2px; }
  .stat .next { font-size: 16px; color: var(--sub); }
  .sheet h3 { font-size: 19px; margin: 18px 0 8px; }
  .sheet ul { margin: 0; padding: 0; list-style: none; }
  .sheet li { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; font-size: 19px; }
  .sheet .empty { color: var(--sub); font-size: 17px; }
  .sheet .danger { margin-top: 28px; text-align: center; }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    -webkit-overflow-scrolling: touch;
  }
  .msg { display: flex; margin: 10px 0; }
  .msg .bubble {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 18px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-break: strict;
  }
  .msg.her .bubble { background: var(--her); border: 1px solid var(--line); border-top-left-radius: 6px; }
  .msg.me { justify-content: flex-end; }
  .msg.me .bubble { background: var(--me); border-top-right-radius: 6px; }
  .msg .bubble img { display: block; max-width: 100%; max-height: 260px; border-radius: 12px; margin-bottom: 6px; }
  .msg.note .bubble { background: transparent; color: var(--sub); font-size: 18px; text-align: center; max-width: 100%; margin: 0 auto; }
  .typing .dots span { animation: blink 1.2s infinite; color: var(--sub); }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  .composer {
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .preview { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .preview button {
    font-size: 17px; color: var(--sub); background: #fff; border: 1px solid var(--line);
    border-radius: 999px; min-height: 44px; padding: 0 14px;
  }
  .tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .tool {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 20px; font-weight: 700;
    min-height: 56px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  .tool .ico { font-size: 26px; line-height: 1; }
  .tool.help-btn { flex: none; flex-direction: column; gap: 0; width: 64px; padding: 0; color: var(--mic); border-color: var(--mic); }
  .tool.help-btn .q { font-size: 22px; line-height: 1; }
  .tool.help-btn .hl { font-size: 12px; line-height: 1.2; }
  .tool.mic { flex: 1.4; background: var(--mic); border-color: var(--mic); color: #fff; }
  .tool.mic.listening { background: #c0392b; border-color: #c0392b; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,.45); } 50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); } }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .guide {
    display: flex; align-items: center; gap: 12px;
    background: #fffbe0; border: 2px solid #f0c94a; border-radius: 14px;
    padding: 6px 8px 6px 10px; margin-bottom: 8px;
    font-size: 19px; line-height: 1.45;
  }
  .guide b { color: #b3261e; }
  .micsvg { width: 1.15em; height: 1.15em; vertical-align: -0.2em; }
  .guide .micbox { display: inline-block; border: 2px solid #b3261e; border-radius: 6px; padding: 0 2px; color: #222; background: #fff; }
  .guide .more { font-size: 14px; color: var(--sub); background: transparent; border: 0; padding: 4px 0; min-height: 32px; text-decoration: underline; }
  .guide .help { display: block; font-size: 15px; color: var(--sub); }
  .guide .tip { display: block; font-size: 16px; color: var(--ink); margin-top: 2px; }
  .guide .more { margin-right: 12px; text-align: left; }
  .guide .links { display: block; }
  .guide .close { flex: none; align-self: flex-start; font-size: 14px; line-height: 1.2; color: var(--sub); background: #fff; border: 1px solid var(--line); border-radius: 10px; min-width: 52px; min-height: 52px; padding: 4px; }
  .kbd { flex: none; width: 64px; }
  .kbd svg { width: 100%; height: auto; display: block; }
  .kbd .hot { animation: hot 1s ease-in-out infinite; }
  @keyframes hot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  textarea {
    flex: 1;
    font: inherit;
    font-size: 22px; /* 16px以上でiPhoneの自動拡大を防ぐ */
    line-height: 1.45;
    padding: 10px 12px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
    resize: none;
    min-height: 56px;
    max-height: 150px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .send {
    flex: none;
    font-size: 21px;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 14px;
    min-width: 84px;
    min-height: 56px;
    padding: 0 14px;
  }
  .send:disabled, .tool:disabled { opacity: .5; }
  .nb { display: inline-block; }
  footer { text-align: center; font-size: 12px; color: var(--sub); padding: 2px 0 4px; }
  footer small { display: block; font-size: 11px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* コロンの動き */
  @media (prefers-reduced-motion: reduce) {
    .avatar img, .pick-img, .tool.mic.listening { animation: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar" aria-hidden="true"><img id="avatarImg" alt=""></div>
    <div class="who">
      <div class="name"><span id="charName"></span><span class="hearts" id="hearts"></span></div>
      <div class="status" id="status">おしゃべりしよう</div>
    </div>
    <div class="head-btns">
      <button class="memo-btn" id="singBtn" type="button" hidden><span class="ico" aria-hidden="true">🎵</span>歌う</button>
      <button class="memo-btn" id="memoBtn" type="button"><span class="ico" aria-hidden="true">📖</span>思い出</button>
    </div>
  </header>

  <main class="log" id="log" aria-live="polite"></main>

  <form class="composer" id="form" autocomplete="off">
    <div class="preview" id="preview" hidden>
      <img id="previewImg" alt="送る写真">
      <button type="button" id="previewRemove">写真をやめる</button>
    </div>
    <div class="guide" id="guide" hidden>
      <div class="kbd" aria-hidden="true">
        <svg viewBox="0 0 100 70">
          <rect x="1" y="1" width="98" height="68" rx="6" fill="#e9e6e1" stroke="#c9c3ba"/>
          <g fill="#fff">
            <rect x="6" y="5" width="88" height="9" rx="2"/>
            <rect x="6" y="17" width="88" height="9" rx="2"/>
            <rect x="6" y="29" width="88" height="9" rx="2"/>
            <rect x="6" y="41" width="88" height="9" rx="2"/>
          </g>
          <g id="kbdMic">
            <circle class="hot" cx="88" cy="63" r="9" fill="#c0392b"/>
            <g transform="translate(82,57) scale(0.5)" color="#fff"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11.5a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="18.5" x2="12" y2="21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="21.5" x2="16" y2="21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
          </g>
        </svg>
      </div>
      <div id="guideText"></div>
      <button class="close" type="button" id="guideClose" aria-label="案内をとじる">✕<br>とじる</button>
    </div>
    <button type="submit" class="skip" id="skip" hidden formnovalidate>答えずに次へ</button>
    <div class="tools">
      <button class="tool mic" id="mic" type="button"><span class="ico" aria-hidden="true"><svg class="micsvg" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11.5a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="18.5" x2="12" y2="21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="21.5" x2="16" y2="21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span id="micLabel">話す</span></button>
      <button class="tool help-btn" id="micHelp" type="button" aria-label="マイクの使い方"><span class="q">？</span><span class="hl">使い方</span></button>
      <button class="tool" id="photo" type="button"><span class="ico" aria-hidden="true">📷</span>写真</button>
    </div>
    <input class="sr" id="photoInput" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
    <div class="row">
      <textarea id="input" rows="1" maxlength="400" placeholder="ここに書いてね" enterkeyhint="send" aria-label="話しかける"></textarea>
      <button class="send" id="send" type="submit">送る</button>
    </div>
  </form>
  <footer>AIポケットファミリー<small>© 2026 nekomori*I’ll</small></footer>
</div>

<div class="sheet" id="songs" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <img id="songsImg" alt="">
      <h2><span class="nb">いっしょに</span><span class="nb">歌おう</span></h2>
      <button type="button" class="close-btn" id="songsClose">とじる</button>
    </div>
    <ul class="song-list" id="songList"></ul>
  </div>
</div>

<div class="sheet" id="player" hidden>
  <div class="sheet-in">
    <div class="sheet-head" style="margin-bottom:0">
      <h2></h2>
      <button type="button" class="close-btn" id="playerClose">とじる</button>
    </div>
    <img class="player-char" id="playerChar" alt="">
    <div class="player-title" id="playerTitle"></div>
    <p class="player-note" id="playerNote"></p>
    <div class="lyrics" id="lyrics"></div>
    <div class="player-ctrl">
      <button type="button" class="play" id="playBtn">▶ 再生</button>
      <button type="button" id="restartBtn">はじめから</button>
    </div>
    <button type="button" class="sang" id="sangBtn">歌えた！</button>
    <audio id="audio" preload="none"></audio>
  </div>
</div>

<div class="sheet" id="memo" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <img id="memoImg" alt="">
      <h2 id="memoTitle"></h2>
      <button type="button" class="close-btn" id="memoClose">とじる</button>
    </div>
    <div class="stat">
      <div>いっしょに過ごした日　<span class="big" id="memoDays"></span></div>
      <div>なかよし度　<span class="hearts" id="memoHearts"></span>　<b id="memoStage"></b></div>
      <div class="next" id="memoNext"></div>
    </div>
    <h3 id="memoNotesTitle"></h3>
    <ul id="memoNotes"></ul>
    <h3 id="memoHabitsTitle"></h3>
    <ul id="memoHabits"></ul>
    <div class="danger"><button class="reset" id="reset" type="button">はじめからやり直す</button></div>
  </div>
</div>

<div class="setup" id="setup" hidden>
  <div class="setup-in">
    <div id="step1">
      <h1>いっしょに暮らす<br>家族をえらんでね</h1>
      <div class="cards">
        <button type="button" class="card" data-char="chamu"><img src="chars/chamu/normal.png" alt=""><b>ちゃむ</b><span>犬と猫がまざった<br>ふしぎな生き物</span></button>
        <button type="button" class="card" data-char="colon"><img src="chars/colon/normal.png" alt=""><b>コロン</b><span>まるくて小さな<br>ロボット</span></button>
      </div>
    </div>
    <div id="step2" hidden>
      <img class="pick-img" id="pickImg" alt="">
      <h1>名前をつけてね</h1>
      <p>このままでも、好きな名前でもいいよ</p>
      <input class="name-input" id="nameInput" maxlength="12" autocomplete="off" enterkeyhint="done" aria-label="名前">
      <button type="button" class="big-btn" id="nameOk">この名前にする</button>
      <button type="button" class="sub-btn" id="backBtn">えらびなおす</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORE_KEY = "pf.chat.v1";
  const MAX_KEEP = 60;
  const PHOTO_TEXT = "（写真を見せたよ）";
  const PROFILE_KEY = "pf.profile.v1";
  const CHARS = {
    chamu: { label: "ちゃむ", img: "chars/chamu/normal.png" },
    colon: { label: "コロン", img: "chars/colon/normal.png" },
  };
  // 最初の会話でキャラが聞くこと（診断ではなく、好みを聞くだけ）
  const QUESTIONS = [
    { key: "call", ask: (n) => "はじめまして。\nわたし、" + n + "だよ。\nこれから、よろしくね。\nあなたのこと、\nなんて呼んだらいい？" },
    { key: "wish", ask: () => "うん、おぼえたよ。\nわたし、何をしたら、\nあなたがうれしい？" },
    { key: "song", ask: () => "教えてくれて、\nありがとう。\nあとひとつだけ。\n好きな歌はある？" },
  ];
  const SKIPPED = "（答えずに次へ）";

  // ---- 育つ（仲よし度・思い出ノート・話し方のくせ） ----
  const STAGE_NAMES = ["はじめまして", "なかよし", "家族", "大の仲よし"];
  const STAGE_POINTS = [0, 30, 80, 200];   // 1日いっしょ=10、1回おしゃべり=1、1曲歌う=5
  const MEMORY_EVERY = 4;                  // 4回話すごとに思い出ノートを書き直す
  // 動画撮影用：URLに ?demo を付けると早く育つ（ふだんは使わない）
  let demoBoost = 1;
  try {
    if (new URLSearchParams(location.search).has("demo")) sessionStorage.setItem("pf.demo", "1");
    if (sessionStorage.getItem("pf.demo") === "1") demoBoost = 10;
  } catch {}
  const LEVEL_UP = {
    chamu: [
      "",
      "えへへ、なんだか、もっとなかよくなれた気がする。しっぽが止まらないよ。",
      "ねえ、わたしたち、もうすっかり家族だね。いつも話してくれて、ありがとう。",
      "あなたの口ぐせ、ちょっとうつっちゃったかも。えへへ、大の仲よしだね。",
    ],
    colon: [
      "",
      "ピピッ。なかよし度が上がったみたい。もっといろんなこと、話したいな。",
      "ピピッ。いつの間にか、すっかり家族になってたね。これからも、よろしくね。",
      "ピピッ。あなたのこと、たくさんわかってきたよ。大の仲よしだね。",
    ],
  };
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function growth() {
    if (!profile.grow || typeof profile.grow !== "object") profile.grow = {};
    const g = profile.grow;
    if (!Array.isArray(g.days)) g.days = [];
    if (!Number.isInteger(g.talks)) g.talks = 0;
    if (!Number.isInteger(g.sung)) g.sung = 0;
    if (!Number.isInteger(g.sinceMemory)) g.sinceMemory = 0;
    if (!Array.isArray(g.notes)) g.notes = [];
    if (!Array.isArray(g.habits)) g.habits = [];
    return g;
  }
  function points() {
    const g = growth();
    return (g.days.length * 10 + g.talks + g.sung * 5) * demoBoost;
  }
  function stageOf(pt) {
    let st = 0;
    for (let i = 0; i < STAGE_POINTS.length; i++) if (pt >= STAGE_POINTS[i]) st = i;
    return st;
  }
  const heartsFor = (st) => "♥".repeat(st + 1) + "♡".repeat(STAGE_NAMES.length - 1 - st);
  function markDay() {
    const g = growth(), t = today();
    if (!g.days.includes(t)) { g.days.push(t); if (g.days.length > 400) g.days = g.days.slice(-400); }
  }
  function profileForServer() {
    const g = growth();
    return {
      char: profile.char,
      name: profile.name,
      call: profile.answers.call || "",
      wish: profile.answers.wish || "",
      song: profile.answers.song || "",
      stage: stageOf(points()),
      days: Math.max(1, g.days.length),
      notes: g.notes,
      habits: g.habits,
    };
  }
  let memoryBusy = false;
  async function updateMemory() {
    if (memoryBusy || !profile) return;
    memoryBusy = true;
    const g = growth();
    try {
      const r = await fetch("/api/memory", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          profile: profileForServer(),
          messages: history.filter(m => m.content && m.content !== "（とばした）").slice(-24).map(m => ({ role: m.role, content: m.content })),
        }),
      });
      if (r.ok) {
        const data = await r.json();
        if (Array.isArray(data.notes) && profile) {
          const before = g.notes.length;
          g.notes = data.notes.filter(x => typeof x === "string");
          g.habits = Array.isArray(data.habits) ? data.habits.filter(x => typeof x === "string") : g.habits;
          g.sinceMemory = 0;
          saveProfile();
          if (g.notes.length > before) $("memoBtn").classList.add("new");
        }
      }
    } catch {} finally { memoryBusy = false; }
  }
  // おしゃべり・歌などのあとに呼ぶ。仲よし度が上がったら、キャラがよろこぶ
  function afterActivity(kind) {
    if (!profile) return;
    const g = growth();
    const before = stageOf(points());
    markDay();
    if (kind === "talk") { g.talks++; g.sinceMemory++; }
    if (kind === "sing") g.sung++;
    saveProfile();
    const after = stageOf(points());
    updateHearts();
    if (after > before) {
      setTimeout(() => {
        sayScripted(LEVEL_UP[profile.char][after]);
        avatar.classList.add("happy");
        setTimeout(() => avatar.classList.remove("happy"), 2400);
      }, 900);
    }
    if (g.sinceMemory >= MEMORY_EVERY) updateMemory();
  }
  function updateHearts() {
    if (!profile) return;
    $("hearts").textContent = heartsFor(stageOf(points()));
  }
  let profile = null; // { char, name, answers: {call, wish, song}, step, createdAt }

  const $ = (id) => document.getElementById(id);
  const log = $("log"), form = $("form"), input = $("input"), send = $("send");
  const avatar = $("avatar"), statusEl = $("status"), resetBtn = $("reset");
  const setupEl = $("setup"), step1 = $("step1"), step2 = $("step2"), nameInput = $("nameInput");
  const micBtn = $("mic"), micLabel = $("micLabel");
  const photoBtn = $("photo"), photoInput = $("photoInput");
  const preview = $("preview"), previewImg = $("previewImg"), previewRemove = $("previewRemove");

  let history = [];
  let canSave = true;
  let pendingPhoto = null; // { data: base64, url: dataURL }

  // ---- 保存（そのスマホの中だけ） ----
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (Array.isArray(data)) {
        history = data.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string");
      }
    } catch { history = []; }
  }
  function loadProfile() {
    try {
      const p = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
      if (p && CHARS[p.char] && typeof p.name === "string") {
        p.answers = p.answers && typeof p.answers === "object" ? p.answers : {};
        p.step = Number.isInteger(p.step) ? p.step : QUESTIONS.length;
        profile = p;
      }
    } catch { profile = null; }
  }
  function saveProfile() {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch {}
  }
  function save() {
    try {
      // 写真そのものは残さない（容量のため）。「写真を見せた」という印だけ残す
      const slim = history.slice(-MAX_KEEP).map(m => ({ role: m.role, content: m.content, photo: m.photo ? true : undefined, song: typeof m.song === "string" ? m.song : undefined }));
      localStorage.setItem(STORE_KEY, JSON.stringify(slim));
    } catch {
      if (canSave) {
        canSave = false;
        addNote("この画面では、お話を残しておけないみたい。閉じると消えてしまうよ。");
      }
    }
  }

  // ---- 表示 ----
  function bubble(cls, text, imgUrl) {
    const row = document.createElement("div");
    row.className = "msg " + cls;
    const b = document.createElement("div");
    b.className = "bubble";
    if (imgUrl) {
      const im = document.createElement("img");
      im.src = imgUrl;
      im.alt = "送った写真";
      b.appendChild(im);
    }
    if (text) b.appendChild(document.createTextNode(text)); // 文字はそのまま（HTMLとして扱わない）
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }
  const addNote = (t) => bubble("note", t);
  const shown = (m) => m.photo && m.content === PHOTO_TEXT ? "📷 写真を見せたよ" : (m.photo ? "📷 " + m.content : m.content);

  function applyChar() {
    const c = CHARS[profile.char];
    $("avatarImg").src = c.img;
    $("charName").textContent = profile.name;
    input.setAttribute("aria-label", profile.name + "に話しかける");
    $("skip").hidden = profile.step >= QUESTIONS.length;
    updateHearts();
  }
  function render() {
    log.textContent = "";
    for (const m of history) {
      bubble(m.role === "user" ? "me" : "her", shown(m));
      if (m.song) songInvite(m.song);
    }
  }
  // キャラが自分から話す（最初の質問など。AIは呼ばない）
  function sayScripted(text) {
    history.push({ role: "assistant", content: text });
    save();
    bubble("her", text);
  }

  function setBusy(on) {
    send.disabled = on;
    photoBtn.disabled = on;
    avatar.classList.toggle("talking", on);
    statusEl.textContent = on ? "かんがえ中…" : "おしゃべりしよう";
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
  }
  input.addEventListener("input", autoGrow);

  // ---- 写真 ----
  photoBtn.addEventListener("click", () => { stopMic(); photoInput.click(); });
  photoInput.addEventListener("change", async () => {
    const file = photoInput.files && photoInput.files[0];
    photoInput.value = "";
    if (!file) return;
    try {
      pendingPhoto = await shrink(file);
      previewImg.src = pendingPhoto.url;
      preview.hidden = false;
      log.scrollTop = log.scrollHeight;
    } catch {
      addNote("この写真は読みこめなかったみたい。ほかの写真でためしてね。");
    }
  });
  previewRemove.addEventListener("click", clearPhoto);
  function clearPhoto() {
    pendingPhoto = null;
    preview.hidden = true;
    previewImg.removeAttribute("src");
  }

  // スマホの中で、長い辺1024pxのJPEGに小さくする
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const max = 1024;
          const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = c.toDataURL("image/jpeg", 0.82);
          URL.revokeObjectURL(url);
          const data = dataUrl.split(",")[1];
          if (!data) return reject(new Error("empty"));
          resolve({ data, url: dataUrl });
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
      img.src = url;
    });
  }

  // ---- マイク（話した言葉を文字にする） ----
  // iPhoneのくせ：話の切れ目ですぐ止まる／止まったあと次が始まらないことがある。
  // → 毎回新しく作り直し、古いものは必ず捨てる。止めるのはこちらで決める（だまって3秒たったら、または押したら）。
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const guide = $("guide"), guideText = $("guideText"), guideClose = $("guideClose"), kbdMic = $("kbdMic");
  // iPhoneはページの中の音声認識が不安定なので使わない（キーボードのマイクを使う）
  let useKeyboardMic = isIOS;

  const GUIDE_OFF_KEY = "pf.guide.off";
  function guideOff() { try { return localStorage.getItem(GUIDE_OFF_KEY) === "1"; } catch { return false; } }
  function showGuide() {
    const where = isAndroid ? "右上" : "右下";
    if (isAndroid) kbdMic.setAttribute("transform", "translate(0,-55)"); // Androidのキーボードは右上にマイクが多い
    else kbdMic.removeAttribute("transform"); // iPhoneは右下
    guideText.innerHTML = 'キーボードの<b>' + where + 'の</b> <span class="micbox"><svg class="micsvg" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11.5a7 7 0 0 0 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="18.5" x2="12" y2="21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="21.5" x2="16" y2="21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span> を<span class="nb">押して話してね</span>'
      + '<span class="tip"><span class="nb">スマホを</span><span class="nb">口に近づけて、</span><span class="nb">ゆっくり</span><span class="nb">話してね</span></span>'
      + (isAndroid ? '' : '<span class="help" id="guideHelp" hidden>設定 → 一般 → キーボード →「音声入力」をオンにしてね</span>')
      + '<span class="links">' + (isAndroid ? '' : '<button type="button" class="more" id="guideMore">マイクが見つからないとき</button>') + '<button type="button" class="more" id="guideOff">次から出さない</button></span>';
    const more = $("guideMore");
    if (more) more.addEventListener("click", () => { $("guideHelp").hidden = false; more.hidden = true; input.focus(); });
    $("guideOff").addEventListener("click", () => {
      try { localStorage.setItem(GUIDE_OFF_KEY, "1"); } catch {}
      hideGuide();
      input.focus();
    });
    guide.hidden = false;
  }
  function hideGuide() { guide.hidden = true; }
  guideClose.addEventListener("click", () => { hideGuide(); input.focus(); });
  // ナビボタン：いつでもナビを出す（「次から出さない」にしていても）
  $("micHelp").addEventListener("click", () => {
    stopMic();
    input.focus();
    showGuide();
    setTimeout(() => { log.scrollTop = log.scrollHeight; }, 300);
  });
  input.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== input && document.activeElement !== micBtn && document.activeElement !== $("micHelp")) hideGuide(); }, 300));

  const SR = useKeyboardMic ? null : (window.SpeechRecognition || window.webkitSpeechRecognition);
  let rec = null, listening = false, baseText = "", heard = "";
  let silenceTimer = null, startTimer = null;
  const SILENCE_MS = 3000;   // 話し終わってから止まるまで
  const NOTHING_MS = 12000;  // 何も聞こえないとき止まるまで
  if (!SR) useKeyboardMic = true;
  function clearMicTimers() { clearTimeout(silenceTimer); clearTimeout(startTimer); }
  function setListening(on) {
    listening = on;
    micBtn.classList.toggle("listening", on);
    avatar.classList.toggle("listening-face", on);
    micLabel.textContent = on ? "聞いてるよ（押すと止まる）" : "話す";
    if (!sending) statusEl.textContent = on ? "聞いてるよ" : "おしゃべりしよう";
  }
  // 古いマイクを捨てる（あとから来る知らせは無視する）
  function dropRec() {
    clearMicTimers();
    const old = rec;
    rec = null;
    if (old) {
      old.onresult = old.onerror = old.onend = old.onstart = null;
      try { old.abort(); } catch {}
    }
  }
  function stopMic() {
    if (!listening && !rec) return;
    const r = rec;
    clearMicTimers();
    setListening(false); // 画面はすぐ元に戻す
    if (r) {
      // 最後の言葉を受け取ってから捨てる
      try { r.stop(); } catch {}
      setTimeout(() => { if (rec === r) dropRec(); }, 1500);
    }
  }
  // 結果をまとめる（iPhoneでは同じ言葉がくり返し届くことがあるので、重ならないようにする）
  function joinResults(results) {
    let text = "";
    for (let i = 0; i < results.length; i++) {
      const t = results[i][0].transcript;
      if (!t) continue;
      if (text && t.startsWith(text)) text = t;      // 前の分を含んで届いた
      else if (text.endsWith(t)) continue;            // 同じものが重ねて届いた
      else text += t;
    }
    return text;
  }
  micBtn.addEventListener("click", () => {
    if (useKeyboardMic) {
      // キーボードを開いて、マイクの場所を案内する（押したその場でfocusしないとiPhoneでキーボードが開かない）
      input.focus();
      if (guideOff()) {
        statusEl.textContent = "キーボードのマイクで話してね";
        setTimeout(() => { if (!sending) statusEl.textContent = "おしゃべりしよう"; }, 4000);
      } else {
        showGuide();
      }
      setTimeout(() => { log.scrollTop = log.scrollHeight; }, 300);
      return;
    }
    if (listening) { stopMic(); return; }
    dropRec();
    const r = new SR();
    rec = r;
    r.lang = "ja-JP";
    r.interimResults = true;
    r.continuous = true;
    r.maxAlternatives = 1;
    baseText = input.value ? input.value.replace(/\s+$/, "") + " " : "";
    heard = "";
    r.onresult = (e) => {
      if (rec !== r) return;
      heard = joinResults(e.results);
      input.value = (baseText + heard).slice(0, 400);
      autoGrow();
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => { if (rec === r) stopMic(); }, SILENCE_MS);
    };
    r.onerror = (e) => {
      if (rec !== r) return;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        addNote("マイクが使えないみたい。スマホの設定で、このページ（Safari や Chrome）にマイクを許可してね。");
      } else if (e.error === "no-speech") {
        addNote("声が聞こえなかったみたい。もう一度「話す」を押してね。");
      } else if (e.error === "audio-capture") {
        addNote("マイクがほかのアプリで使われているみたい。ほかのアプリを閉じて、もう一度押してね。");
      } else if (e.error !== "aborted") {
        addNote("うまく聞き取れなかったみたい。もう一度「話す」を押してね。");
      }
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "network") {
        useKeyboardMic = true; // 次からはキーボードのマイクで
      }
      setListening(false);
      dropRec();
    };
    r.onend = () => {
      if (rec !== r) return;
      setListening(false);
      dropRec();
    };
    try {
      r.start();
      setListening(true);
      // 何も聞こえないまま長く待たせない
      silenceTimer = setTimeout(() => { if (rec === r && !heard) { stopMic(); addNote("声が聞こえなかったみたい。もう一度「話す」を押してね。"); } }, NOTHING_MS);
    } catch {
      setListening(false);
      dropRec();
      addNote("マイクの準備ができなかったみたい。少し待って、もう一度「話す」を押してね。");
    }
  });

  // ---- 送る ----
  let sending = false;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (sending) return;
    stopMic();
    const photo = pendingPhoto;
    let text = (e.submitter && e.submitter.id === "skip") ? SKIPPED : input.value.trim();
    if (!text && !photo) { input.focus(); return; }
    if (!text && photo) text = PHOTO_TEXT;

    // 最初の会話（質問への答えを、最初の思い出として残す）
    if (profile && profile.step < QUESTIONS.length) {
      const q = QUESTIONS[profile.step];
      profile.answers[q.key] = text === SKIPPED ? "" : text.slice(0, 100);
      profile.step++;
      saveProfile();
      if (text !== SKIPPED) input.value = "";
      autoGrow();
      hideGuide();
      history.push({ role: "user", content: text === SKIPPED ? "（とばした）" : text });
      save();
      bubble("me", text === SKIPPED ? "（とばした）" : text);
      $("skip").hidden = profile.step >= QUESTIONS.length;
      if (profile.step < QUESTIONS.length && !photo) {
        const next = profile.step;
        setTimeout(() => { if (profile && QUESTIONS[next]) sayScripted(QUESTIONS[next].ask(profile.name)); }, 500);
        return;
      }
      // 最後の答えのあとは、AIがそのまま返事をする（下へ続く）
      history.pop();
      log.lastElementChild && log.lastElementChild.remove();
      if (text === SKIPPED) text = "（とばした）";
    }

    sending = true;
    hideGuide();
    setBusy(true);
    input.value = "";
    autoGrow();
    clearPhoto();
    const entry = { role: "user", content: text, photo: photo ? true : undefined };
    history.push(entry);
    save();
    const myRow = bubble("me", text === PHOTO_TEXT ? "" : text, photo && photo.url);

    const typing = bubble("her typing", "");
    typing.querySelector(".bubble").innerHTML = '<span class="dots"><span>・</span><span>・</span><span>・</span></span>';

    const fail = (msg) => {
      typing.remove();
      history.pop();
      save();
      myRow.remove();
      input.value = text === PHOTO_TEXT ? "" : text;
      autoGrow();
      if (photo) { pendingPhoto = photo; previewImg.src = photo.url; preview.hidden = false; }
      addNote(msg);
    };

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    try {
      const payload = {
        messages: history.map(m => ({ role: m.role, content: m.content })),
        profile: profile ? profileForServer() : null,
        songs: SONGS.slice(0, 20).map(x => ({ id: x.id, title: x.title, tag: x.tag || "" })),
      };
      if (photo) payload.image = { type: "image/jpeg", data: photo.data };
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: ctrl.signal,
      });
      let data = {};
      try { data = await r.json(); } catch {}
      if (r.ok && data.reply) {
        typing.remove();
        history.push({ role: "assistant", content: data.reply });
        save();
        bubble("her", data.reply);
        if (typeof data.song === "string") {
          songInvite(data.song);
          history[history.length - 1].song = data.song;
          save();
        }
        afterActivity("talk");
      } else {
        fail(data.message || "うまく届かなかったみたい。もう一度送ってみてね。");
      }
    } catch {
      fail("電波がとどかなかったみたい。もう一度送ってみてね。");
    } finally {
      clearTimeout(timer);
      sending = false;
      setBusy(false);
    }
  });

  // PCでは Ctrl/⌘+Enter で送信（スマホは「送る」ボタン）
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit(); }
  });

  // ---- はじめから（2回押し） ----
  let armTimer = null;
  resetBtn.addEventListener("click", () => {
    if (!resetBtn.classList.contains("armed")) {
      resetBtn.classList.add("armed");
      resetBtn.textContent = "もう一度押すと、思い出も全部消えます";
      clearTimeout(armTimer);
      armTimer = setTimeout(() => { resetBtn.classList.remove("armed"); resetBtn.textContent = "はじめからやり直す"; }, 4000);
      return;
    }
    clearTimeout(armTimer);
    resetBtn.classList.remove("armed");
    resetBtn.textContent = "はじめからやり直す";
    history = [];
    clearPhoto();
    save();
    profile = null;
    try { localStorage.removeItem(PROFILE_KEY); } catch {}
    $("memo").hidden = true;
    render();
    openSetup();
  });

  // ---- 歌 ----
  // 曲の一覧は songs/songs.json（オーナーの自作曲）。{ id, title, tag, file, lyrics, credit }
  let SONGS = [];
  const SONG_TAGS = ["寄り添う", "泣きたいとき", "静かに", "楽しい"];
  const SANG_LINES = {
    chamu: [
      "わぁ、すてきな声だった！しっぽが、ぶんぶんしちゃったよ。",
      "いっしょに歌えて、とってもうれしい。えへへ、また歌おうね。",
      "声、ちゃんと届いてたよ。なんだか、ぽかぽかしてきた。",
    ],
    colon: [
      "ピピッ！すてきな歌声、ちゃんと聞こえたよ。また歌おうね。",
      "いっしょに歌えて、うれしいな。ヘッドホンが、ぽかぽかしてる。",
      "ピピッ。きょうの歌も、大事な思い出にしておくね。",
    ],
  };
  async function loadSongs() {
    try {
      const r = await fetch("songs/songs.json", { cache: "no-cache" });
      const list = await r.json();
      SONGS = Array.isArray(list) ? list.filter(x => x && typeof x.id === "string" && typeof x.title === "string" && typeof x.file === "string") : [];
    } catch { SONGS = []; }
    $("singBtn").hidden = SONGS.length === 0;
  }
  const songById = (id) => SONGS.find(x => x.id === id);
  function openSongs() {
    if (!profile || !SONGS.length) return;
    $("songsImg").src = CHARS[profile.char].img;
    const ul = $("songList");
    ul.textContent = "";
    for (const sg of SONGS) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = sg.title;
      if (sg.tag) { const t = document.createElement("span"); t.className = "tag"; t.textContent = sg.tag; b.appendChild(t); }
      b.addEventListener("click", () => { $("songs").hidden = true; openPlayer(sg.id); });
      li.appendChild(b);
      ul.appendChild(li);
    }
    $("songs").hidden = false;
  }
  const audio = $("audio"), playBtn = $("playBtn"), playerChar = $("playerChar");
  let currentSong = null;
  function setPlaying(on) {
    playBtn.textContent = on ? "⏸ とめる" : "▶ 再生";
    playerChar.classList.toggle("dance", on);
  }
  function openPlayer(id) {
    const sg = songById(id);
    if (!sg || !profile) return;
    stopMic();
    currentSong = sg;
    playerChar.src = CHARS[profile.char].img;
    playerChar.classList.remove("cheer");
    $("playerTitle").textContent = sg.title;
    $("playerNote").textContent = sg.credit || "";
    $("lyrics").textContent = sg.lyrics || "（歌詞はありません。曲に合わせて、自由に歌ってね）";
    $("lyrics").scrollTop = 0;
    audio.src = sg.file;
    setPlaying(false);
    $("player").hidden = false;
  }
  playBtn.addEventListener("click", async () => {
    if (!currentSong) return;
    if (!audio.paused) { audio.pause(); return; }
    try { await audio.play(); } catch { addNote("曲がうまく流れなかったみたい。もう一度押してみてね。"); }
  });
  $("restartBtn").addEventListener("click", async () => {
    audio.currentTime = 0;
    try { await audio.play(); } catch {}
  });
  audio.addEventListener("play", () => setPlaying(true));
  audio.addEventListener("pause", () => setPlaying(false));
  audio.addEventListener("ended", () => { setPlaying(false); $("sangBtn").focus(); });
  function closePlayer() {
    audio.pause();
    $("player").hidden = true;
  }
  $("playerClose").addEventListener("click", closePlayer);
  $("sangBtn").addEventListener("click", () => {
    if (!profile || !currentSong) return;
    playerChar.classList.remove("dance");
    void playerChar.offsetWidth;
    playerChar.classList.add("cheer");
    const lines = SANG_LINES[profile.char];
    const line = lines[Math.floor(Math.random() * lines.length)];
    const title = currentSong.title;
    setTimeout(() => {
      closePlayer();
      history.push({ role: "user", content: "（いっしょに『" + title + "』を歌った）" });
      save();
      bubble("me", "🎵 『" + title + "』を歌ったよ");
      sayScripted(line);
      afterActivity("sing");
    }, 1400);
  });
  $("singBtn").addEventListener("click", () => { stopMic(); openSongs(); });
  $("songsClose").addEventListener("click", () => { $("songs").hidden = true; });

  // キャラが曲に誘ったときのボタン
  function songInvite(id) {
    const sg = songById(id);
    if (!sg) return;
    const row = log.lastElementChild;
    if (!row) return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "song-btn";
    const s1 = document.createElement("span"); s1.className = "nb"; s1.textContent = "🎵 『" + sg.title + "』";
    const s2 = document.createElement("span"); s2.className = "nb"; s2.textContent = "をかける";
    b.append(s1, s2);
    b.addEventListener("click", () => openPlayer(sg.id));
    row.querySelector(".bubble").appendChild(b);
    log.scrollTop = log.scrollHeight;
  }

  // ---- 思い出ノート ----
  function fillList(ul, items, emptyText) {
    ul.textContent = "";
    if (!items.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = emptyText;
      ul.appendChild(li);
      return;
    }
    for (const t of items) {
      const li = document.createElement("li");
      li.textContent = t;
      ul.appendChild(li);
    }
  }
  function openMemo() {
    if (!profile) return;
    const g = growth(), pt = points(), st = stageOf(pt);
    $("memoImg").src = CHARS[profile.char].img;
    $("memoTitle").innerHTML = "";
    const t1 = document.createElement("span"); t1.className = "nb"; t1.textContent = profile.name + "との";
    const t2 = document.createElement("span"); t2.className = "nb"; t2.textContent = "思い出";
    $("memoTitle").append(t1, t2);
    $("memoDays").textContent = Math.max(1, g.days.length) + "日";
    $("memoHearts").textContent = heartsFor(st);
    $("memoStage").textContent = STAGE_NAMES[st];
    $("memoNext").textContent = st < STAGE_NAMES.length - 1
      ? "おしゃべりしたり、歌ったりすると、もっとなかよくなるよ"
      : "これからも、ずっといっしょだよ";
    $("memoNotesTitle").textContent = profile.name + "が覚えていること";
    const firsts = [];
    if (profile.answers.call) firsts.push("呼び名：" + profile.answers.call);
    if (profile.answers.song) firsts.push("好きな歌：" + profile.answers.song);
    fillList($("memoNotes"), firsts.concat(g.notes), "これから、たくさん覚えていくね");
    $("memoHabitsTitle").textContent = profile.name + "の口ぐせ（いっしょに育ったもの）";
    fillList($("memoHabits"), g.habits, "まだないよ。いっぱい話すと、育っていくよ");
    $("memoBtn").classList.remove("new");
    $("memo").hidden = false;
  }
  $("memoBtn").addEventListener("click", () => { stopMic(); openMemo(); });
  $("memoClose").addEventListener("click", () => { $("memo").hidden = true; });

  // ---- 家族えらび ----
  let picked = null;
  function openSetup() {
    picked = null;
    step1.hidden = false;
    step2.hidden = true;
    setupEl.hidden = false;
  }
  setupEl.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", () => {
      picked = card.dataset.char;
      $("pickImg").src = CHARS[picked].img;
      nameInput.value = CHARS[picked].label;
      step1.hidden = true;
      step2.hidden = false;
    });
  });
  $("backBtn").addEventListener("click", openSetup);
  nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("nameOk").click(); } });
  $("nameOk").addEventListener("click", () => {
    if (!picked) return;
    const name = nameInput.value.replace(/\s+/g, " ").trim().slice(0, 12) || CHARS[picked].label;
    profile = { char: picked, name, answers: {}, step: 0, createdAt: new Date().toISOString() };
    markDay();
    saveProfile();
    history = [];
    save();
    setupEl.hidden = true;
    applyChar();
    render();
    setTimeout(() => sayScripted(QUESTIONS[0].ask(profile.name)), 300);
  });

  load();
  loadProfile();
  loadSongs().then(() => { if (profile) render(); });
  if (!profile) {
    history = []; // 家族を決める前の古い会話は使わない
    save();
    render();
    openSetup();
  } else {
    markDay();
    saveProfile();
    applyChar();
    render();
  }
})();
</script>
</body>
</html>
